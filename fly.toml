# fly.toml app configuration file generated for easy-audit on 2026-11-23T08:04:11Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'easy-audit'
primary_region = 'sin'

[build]
[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
